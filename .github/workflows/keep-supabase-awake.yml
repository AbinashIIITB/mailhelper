# Supabase pauses a free project after 7 days without API requests, and
# resuming it is a manual click in their dashboard — meaning an unused Mail
# Helper would appear completely broken the next time you went to send a
# campaign. This pings the project every 3 days to reset that timer.
#
# Setup: add a repository secret SUPABASE_URL (https://<ref>.supabase.co) and
# SUPABASE_ANON_KEY (Project Settings → API → anon/public key). Without them
# the job exits quietly, so the workflow is harmless if you'd rather not use it.
#
# Caveat: GitHub disables scheduled workflows in a repository with no commits
# for 60 days. If you stop touching this repo entirely, the keep-alive stops
# too and the project will eventually pause. Re-enable it from the Actions tab.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY not set — skipping."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/" -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase responded $code"
          # A paused project answers 5xx; anything else means it is awake.
          case "$code" in
            2*|3*|4*) exit 0 ;;
            *) echo "::error::Project may be paused — check the Supabase dashboard."; exit 1 ;;
          esac
