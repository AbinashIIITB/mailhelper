# Supabase pauses a free project after 7 days without activity, and resuming it
# is a manual click in their dashboard — meaning an unused Mail Helper would
# appear completely broken the next time you went to send a campaign. This runs
# a trivial query every 3 days to reset that timer.
#
# It queries Postgres directly rather than calling the REST API, because the
# Data API roles are deliberately stripped of all access — see
# packages/db/prisma/lockdown.sql.
#
# Setup: add a repository secret SUPABASE_DB_URL containing the session-pooler
# connection string (port 5432). Without it the job exits quietly, so the
# workflow is harmless if you'd rather not use it.
#
# Caveat: GitHub disables scheduled workflows in a repository with no commits
# for 60 days. If you stop touching this repo entirely, the keep-alive stops
# too and the project will eventually pause. Re-enable it from the Actions tab.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL not set — skipping."
            exit 0
          fi
          psql "$SUPABASE_DB_URL" -Atc "select 'awake at ' || now();"
