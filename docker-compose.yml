services:
  postgres:
    image: postgres:16
    container_name: mailhelper-postgres
    environment:
      POSTGRES_DB: mailhelper
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      # Host 55432 to avoid clashing with other local/Docker Postgres instances.
      # Override with POSTGRES_PORT if something else already holds it -
      # Compose otherwise starts the container with no published port at all.
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mailhelper-redis
    ports:
      # Host 6380 to avoid clashing with a native Redis on 6379.
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
